
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUR</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050505;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.stars {
  position: fixed;
  inset: 0;
  background-image: radial-gradient(#ffffff55 1px, transparent 1px);
  background-size: 38px 38px;
  opacity: .2;
}

.wrapper {
  width: 100%;
  max-width: 650px;
  position: relative;
  animation: beat 1.5s infinite;
}

canvas {
  width: 100%;
  height: auto;
  display: block;
}

.name {
  position: absolute;
  top: 49%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: clamp(35px, 10vw, 65px);
  font-weight: 900;
  letter-spacing: 8px;
  text-shadow: 0 0 12px #ff6040, 0 0 30px #ff174f;
  pointer-events: none;
}

@keyframes beat {
  0%,100% { transform: scale(1); }
  15% { transform: scale(1.025); }
  30% { transform: scale(1); }
  45% { transform: scale(1.018); }
  60% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="wrapper">
  <canvas id="canvas" width="600" height="540"></canvas>
  <div class="name">NUR</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const words = [
"Seni seviyorum",
"I love you",
"Je t'aime",
"Te amo",
"Ich liebe dich",
"Ti amo",
"Я тебя люблю",
"愛してる",
"사랑해",
"我爱你",
"Eu te amo",
"Ik hou van jou",
"أحبك",
"Anh yêu em",
"Jag älskar dig",
"Kocham cię",
"Σ' αγαπώ",
"Volim te",
"Nakupenda",
"Te quiero",
"Miluji tě",
"Të dua",
"Minä rakastan sinua",
"Szeretlek"
];

const path = new Path2D();

path.moveTo(300, 490);
path.bezierCurveTo(245, 430, 35, 300, 35, 165);
path.bezierCurveTo(35, 55, 175, 5, 300, 145);
path.bezierCurveTo(425, 5, 565, 55, 565, 165);
path.bezierCurveTo(565, 300, 355, 430, 300, 490);
path.closePath();

function draw() {
  ctx.clearRect(0, 0, 600, 540);

  ctx.save();

  // Yalnızca kalbin içindeki yazıları göster
  ctx.clip(path);

  ctx.font = "bold 12px Arial";
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  let row = 0;

  for (let y = 20; y < 520; y += 16) {
    let text = "";
    let index = row % words.length;

    while (text.length < 250) {
      text += words[index] + "     ";
      index = (index + 1) % words.length;
    }

    ctx.fillStyle = row % 2 === 0 ? "#ff755f" : "#ff9970";
    ctx.shadowColor = "#ff452f";
    ctx.shadowBlur = 7;

    ctx.fillText(text, row % 2 === 0 ? 0 : -60, y);

    row++;
  }

  // Dış çizgi YOK
  ctx.restore();
}

function animate() {
  draw();
  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
