
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUR ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle, #310817, #10020a 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    color: white;
}

.stars {
    position: absolute;
    inset: 0;
    background-image:
    radial-gradient(white 1px, transparent 1px);
    background-size: 45px 45px;
    opacity: .25;
}

.scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.heart-container {
    position: relative;
    width: 210px;
    height: 210px;
    z-index: 5;
    animation: heartbeat 1.3s infinite;
    filter: drop-shadow(0 0 15px #ff1764)
            drop-shadow(0 0 35px #ff1764);
}

.heart {
    width: 100%;
    height: 100%;
}

.heart-name {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 5px;
    color: white;
    text-shadow: 0 0 12px #ff80ac,
                 0 0 25px #ff1764;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.13); }
    30% { transform: scale(1); }
    45% { transform: scale(1.09); }
    60% { transform: scale(1); }
}

.orbit {
    position: absolute;
    width: min(94vw, 430px);
    height: min(94vw, 430px);
    border-radius: 50%;
    animation: rotate 35s linear infinite;
}

.orbit.second {
    width: min(99vw, 470px);
    height: min(99vw, 470px);
    animation: rotateReverse 45s linear infinite;
}

.word {
    position: absolute;
    left: 50%;
    top: 50%;
    white-space: nowrap;
    color: #ffb5d0;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 0 0 10px #ff1764;
    transform:
      rotate(var(--angle))
      translateY(calc(var(--radius) * -1));
    transform-origin: 0 0;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes rotateReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

.bottom-text {
    position: absolute;
    bottom: 9%;
    font-size: 16px;
    letter-spacing: 3px;
    color: #ffb4d0;
    text-shadow: 0 0 15px #ff1764;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { opacity: .5; }
    to { opacity: 1; }
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="scene">

    <div class="orbit" id="orbit1"></div>
    <div class="orbit second" id="orbit2"></div>

    <div class="heart-container">

        <svg class="heart" viewBox="0 0 200 200">
            <path
              d="M100 175
              C80 155 15 110 15 65
              C15 15 75 5 100 50
              C125 5 185 15 185 65
              C185 110 120 155 100 175Z"
              fill="#ff174f"
              stroke="#ff9ab9"
              stroke-width="2"/>
        </svg>

        <div class="heart-name">NUR</div>

    </div>

    <div class="bottom-text">
        FOREVER IN MY HEART ♡
    </div>

</div>

<script>

const languages = [
" I LOVE YOU ❤️ ",
" SENİ SEVİYORUM ❤️ ",
" JE T'AIME ❤️ ",
" TE AMO ❤️ ",
" ICH LIEBE DICH ❤️ ",
" TI AMO ❤️ ",
" Я ТЕБЯ ЛЮБЛЮ ❤️ ",
" 愛してる ❤️ ",
" 사랑해 ❤️ ",
" أحبك ❤️ ",
" मैं तुमसे प्यार करता हूँ ❤️ ",
" 我爱你 ❤️ ",
" EU TE AMO ❤️ ",
" IK HOU VAN JOU ❤️ ",
" Σ'ΑΓΑΠΩ ❤️ ",
" MINÄ RAKASTAN SINUA ❤️ ",
" JAG ÄLSKAR DIG ❤️ ",
" JEG ELSKER DEG ❤️ ",
" KOCHAM CIĘ ❤️ ",
" MILUJI TĚ ❤️ ",
" TE QUIERO ❤️ ",
" VOLIM TE ❤️ ",
" SZERETLEK ❤️ ",
" TË DUA ❤️ ",
" MAITE ZAITUT ❤️ ",
" AISHITERU ❤️ ",
" SARANGHAE ❤️ ",
" NAKUPENDA ❤️ ",
" ANI OHEV OTACH ❤️ ",
" T'AMO ❤️ ",
" LOVE YOU ❤️ ",
" EU TE AMO MUITO ❤️ ",
" YA LYUBLYU TEBYA ❤️ ",
" MOHABBAT KARTI HOON ❤️ ",
" SENI SEVIRIM ❤️ ",
" AROHA ANA AU KI A KOE ❤️ ",
" NGIYAKUTHANDA ❤️ ",
" TE SAKAM ❤️ "
];

function createOrbit(id, radius) {
    const orbit = document.getElementById(id);

    languages.forEach((word, i) => {
        const span = document.createElement("span");
        span.className = "word";
        span.textContent = word;

        const angle = (360 / languages.length) * i;

        span.style.setProperty("--angle", angle + "deg");
        span.style.setProperty("--radius", radius + "px");

        orbit.appendChild(span);
    });
}

createOrbit("orbit1", 135);
createOrbit("orbit2", 185);

</script>

</body>
</html>
