
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUR | Love</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100vh;
  background: radial-gradient(ellipse at center,
    #180511 0%, #090309 55%, #030203 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.stars {
  position: fixed;
  inset: 0;
  background-image: radial-gradient(#ffffff55 1px, transparent 1px);
  background-size: 42px 42px;
  opacity: .22;
}

.wrapper {
  width: min(96vw, 620px);
  position: relative;
  animation: heartbeat 2s ease-in-out infinite;
}

canvas {
  width: 100%;
  height: auto;
  display: block;
}

.name {
  position: absolute;
  left: 50%;
  top: 49%;
  transform: translate(-50%, -50%);
  font-size: clamp(36px, 10vw, 66px);
  font-weight: 900;
  letter-spacing: 9px;
  color: white;
  text-shadow:
    0 0 5px white,
    0 0 15px #ff1493,
    0 0 30px #ff1493,
    0 0 60px #ff1493;
  z-index: 5;
  pointer-events: none;
  animation: nameGlow 2s infinite alternate;
}

@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  20% { transform: scale(1.025); }
  40% { transform: scale(1); }
  60% { transform: scale(1.015); }
}

@keyframes nameGlow {
  from { opacity: .85; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="wrapper">
  <canvas id="heart" width="1800" height="1620"></canvas>
  <div class="name">NUR</div>
</div>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const W = 600;
const H = 540;

const words = [
 "Seni seviyorum",
 "I love you",
 "Je t'aime",
 "Te amo",
 "Ich liebe dich",
 "Ti amo",
 "Я тебя люблю",
 "愛してる",
 "사랑해",
 "我爱你",
 "Eu te amo",
 "Ik hou van jou",
 "أحبك",
 "Anh yêu em",
 "Jag älskar dig",
 "Kocham cię",
 "Σ' αγαπώ",
 "Volim te",
 "Nakupenda",
 "Te quiero",
 "Miluji tě",
 "Të dua",
 "Minä rakastan sinua",
 "Szeretlek",
 "Maite zaitut",
 "Seni sevirem",
 "Aishiteru"
];

// Kalbin geometrisi
const heart = new Path2D();

heart.moveTo(300, 490);

heart.bezierCurveTo(
  245, 430,
  35, 300,
  35, 165
);

heart.bezierCurveTo(
  35, 55,
  175, 5,
  300, 145
);

heart.bezierCurveTo(
  425, 5,
  565, 55,
  565, 165
);

heart.bezierCurveTo(
  565, 300,
  355, 430,
  300, 490
);

heart.closePath();

// Kelimeleri kırpmadan yerleştir
function drawLine(y, row) {

  const intervals = [];
  let inside = false;
  let start = 0;

  // Kalbin o satırdaki dolu bölgelerini bul
  for (let x = 0; x <= W; x += 2) {

    const current = ctx.isPointInPath(heart, x, y);

    if (current && !inside) {
      start = x;
      inside = true;
    }

    if (!current && inside) {
      intervals.push([start, x]);
      inside = false;
    }
  }

  if (inside) intervals.push([start, W]);

  // Her bölgeye tam kelimeler yerleştir
  intervals.forEach(([left, right], part) => {

    const width = right - left;

    if (width < 35) return;

    const fontSize = width < 85 ? 10 : 13;

    ctx.font = `bold ${fontSize}px Arial`;

    const gap = fontSize < 12 ? 7 : 9;

    let currentWords = [];
    let totalWidth = 0;

    let index = (row * 3 + part * 5) % words.length;

    while (true) {

      const word = words[index];
      const wordWidth = ctx.measureText(word).width;

      if (totalWidth + wordWidth > width) break;

      currentWords.push({
        word,
        width: wordWidth
      });

      totalWidth += wordWidth + gap;

      index = (index + 1) % words.length;
    }

    if (currentWords.length === 0) return;

    totalWidth -= gap;

    // Ortala
    let x = left + (width - totalWidth) / 2;

    currentWords.forEach((item, i) => {

      const color = i % 3 === 0
        ? "#ff8acb"
        : "#ffb0dd";

      ctx.fillStyle = color;
      ctx.shadowColor = "#ff1493";
      ctx.shadowBlur = 10;

      ctx.fillText(item.word, x, y);

      x += item.width + gap;
    });

  });
}

function draw() {

  ctx.setTransform(3, 0, 0, 3, 0, 0);

  ctx.clearRect(0, 0, W, H);

  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  // Satırları kalbin şekline göre oluştur
  let row = 0;

  for (let y = 24; y < 510; y += 17) {
    drawLine(y, row);
    row++;
  }

  ctx.shadowBlur = 0;
}

draw();

</script>

</body>
</html>
