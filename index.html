<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I Love You - NUR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let W, H, scale;
        const points = [];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            scale = Math.min(W, H) / 480;
        }
        window.addEventListener('resize', resize);
        resize();

        // Kalp formülü ile tüm noktaları hemen oluştur
        function createHeart() {
            points.length = 0;
            for (let i = 0; i < 360; i += 1.8) {
                const t = i * Math.PI / 180;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

                // Birkaç katman (derinlik hissi için)
                for (let z = -14; z <= 14; z += 7) {
                    points.push({
                        x: x * 11.5,
                        y: y * 11.5,
                        z: z,
                        text: "I love you"
                    });
                }
            }
        }
        createHeart();

        let time = 0;

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, W, H);

            time += 0.014;

            const rotY = time * 1.1;
            const rotX = Math.sin(time * 0.35) * 0.3;

            const cosY = Math.cos(rotY);
            const sinY = Math.sin(rotY);
            const cosX = Math.cos(rotX);
            const sinX = Math.sin(rotX);

            // 3D dönüş + perspektif
            const projected = points.map(p => {
                // Y ekseni etrafında dön
                let x1 = p.x * cosY - p.z * sinY;
                let z1 = p.x * sinY + p.z * cosY;
                let y1 = p.y;

                // X ekseni etrafında hafif sallanma
                let y2 = y1 * cosX - z1 * sinX;
                let z2 = y1 * sinX + z1 * cosX;

                return {
                    x: x1,
                    y: y2,
                    z: z2,
                    text: p.text
                };
            });

            // Uzaktakileri arkaya koy
            projected.sort((a, b) => b.z - a.z);

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (const p of projected) {
                const perspective = 380 / (380 + p.z);
                const px = W / 2 + p.x * scale * perspective;
                const py = H / 2 + p.y * scale * perspective;

                // Derinliğe göre parlaklık
                let light = 90 - (p.z / 40) * 30;
                light = Math.max(40, Math.min(100, light));

                ctx.fillStyle = `hsl(345, 100%, ${light}%)`;
                const size = Math.max(5, 7.5 * scale * perspective);
                ctx.font = `bold ${size}px Arial`;
                ctx.fillText(p.text, px, py);
            }

            // ===== Ortadaki NUR =====
            ctx.save();
            ctx.shadowColor = "#ff2d55";
            ctx.shadowBlur = 28;
            ctx.fillStyle = "#ffffff";
            ctx.font = `bold ${Math.round(52 * scale)}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("NUR", W / 2, H / 2);
            ctx.restore();

            requestAnimationFrame(draw);
        }

        // Başlat
        draw();
    </script>
</body>
</html>
