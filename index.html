
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUR ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #080609;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.stars {
    position: fixed;
    inset: 0;
    background-image:
    radial-gradient(#ffffff55 1px, transparent 1px);
    background-size: 38px 38px;
    opacity: .35;
}

.container {
    width: 100%;
    max-width: 600px;
    padding: 12px;
    position: relative;
    z-index: 2;
}

.heart {
    width: 100%;
    position: relative;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 12px #ff174c);
}

.line {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 2px auto;
    height: 17px;
    overflow: visible;
    white-space: nowrap;
    color: #ff858f;
    font-size: clamp(7px, 1.8vw, 11px);
    font-weight: bold;
    text-shadow:
        0 0 5px #ff244f,
        0 0 12px #ff174c;
    animation: glow 2s ease-in-out infinite alternate;
}

.line span {
    display: inline-block;
    white-space: pre;
}

.name {
    position: absolute;
    top: 49%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: clamp(30px, 9vw, 48px);
    font-weight: 900;
    letter-spacing: 8px;
    text-shadow:
        0 0 8px white,
        0 0 20px #ff174c,
        0 0 40px #ff174c;
    z-index: 5;
    animation: nameGlow 1.5s infinite alternate;
    pointer-events: none;
}

@keyframes float {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.025); }
}

@keyframes glow {
    from { opacity: .65; }
    to { opacity: 1; }
}

@keyframes nameGlow {
    from { text-shadow: 0 0 10px white, 0 0 20px #ff174c; }
    to { text-shadow: 0 0 20px white, 0 0 45px #ff174c; }
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
    <div class="heart" id="heart"></div>
    <div class="name">NUR</div>
</div>

<script>

const words = [
    "Seni seviyorum",
    "I love you",
    "Je t'aime",
    "Te amo",
    "Ich liebe dich",
    "Ti amo",
    "Я тебя люблю",
    "愛してる",
    "사랑해",
    "我爱你",
    "Eu te amo",
    "Ik hou van jou",
    "أحبك",
    "Aşkım",
    "Saranghae",
    "Kocham cię",
    "Σ' αγαπώ",
    "Anh yêu em",
    "Jag älskar dig",
    "Volim te",
    "Nakupenda",
    "Ya tebya lyublyu",
    "Minä rakastan sinua",
    "Te quiero",
    "Miluji tě",
    "Të dua",
    "Aroha ahau ki a koe"
];

const heart = document.getElementById("heart");

const widths = [
    35, 52, 65, 76, 86,
    94, 100, 100, 100, 98,
    94, 90, 84, 77, 69,
    61, 53, 45, 37, 29,
    21, 14, 8
];

widths.forEach((width, row) => {

    const line = document.createElement("div");
    line.className = "line";
    line.style.width = width + "%";

    let content = "";
    let index = row % words.length;

    while (content.length < 250) {
        content += words[index] + "   ";
        index = (index + 1) % words.length;
    }

    line.textContent = content;

    heart.appendChild(line);

});

</script>

</body>
</html>
