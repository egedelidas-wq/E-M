<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUR | Love</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  min-height: 100vh;
  background: radial-gradient(ellipse at center,
    #24051b 0%, #0c030b 55%, #030203 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.stars {
  position: fixed;
  inset: 0;
  background-image: radial-gradient(#ffffff55 1px, transparent 1px);
  background-size: 42px 42px;
  opacity: .22;
}

.wrapper {
  width: min(96vw, 680px);
  position: relative;
  animation: heartbeat 2s ease-in-out infinite;
}

canvas {
  width: 100%;
  height: auto;
  display: block;
}

.name {
  position: absolute;
  left: 50%;
  top: 49%;
  transform: translate(-50%, -50%);
  font-size: clamp(36px, 10vw, 66px);
  font-weight: 900;
  letter-spacing: 9px;
  color: white;
  text-shadow:
    0 0 5px white,
    0 0 15px #ff1493,
    0 0 30px #ff1493,
    0 0 60px #ff1493;
  z-index: 5;
  pointer-events: none;
  animation: nameGlow 2s infinite alternate;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.035); }
  30% { transform: scale(1); }
  45% { transform: scale(1.02); }
  60% { transform: scale(1); }
}

@keyframes nameGlow {
  from { opacity: .85; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="wrapper">
  <canvas id="heart" width="1800" height="1620"></canvas>
  <div class="name">NUR</div>
</div>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const W = 600;
const H = 540;

const words = [
 "Seni seviyorum",
 "I love you",
 "Je t'aime",
 "Te amo",
 "Ich liebe dich",
 "Ti amo",
 "Я тебя люблю",
 "愛してる",
 "사랑해",
 "我爱你",
 "Eu te amo",
 "Ik hou van jou",
 "أحبك",
 "Anh yêu em",
 "Jag älskar dig",
 "Kocham cię",
 "Σ' αγαπώ",
 "Volim te",
 "Nakupenda",
 "Te quiero",
 "Miluji tě",
 "Të dua",
 "Minä rakastan sinua",
 "Szeretlek",
 "Maite zaitut",
 "Seni sevirem",
 "Aishiteru"
];

// Gerçek kalp geometrisi
function insideHeart(x, y) {
  const px = (x - 300) / 250;
  const py = (y - 255) / 230;

  const a = px * px + py * py - 1;

  return a * a * a -
    px * px * py * py * py <= 0;
}

function draw() {
  ctx.setTransform(3, 0, 0, 3, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  let row = 0;

  // Küçük aralıklarla tarama: kalbin tamamını doldur
  for (let y = 30; y < 500; y += 10) {

    let start = -1;
    let inside = false;

    for (let x = 0; x <= W; x += 1) {

      const current = insideHeart(x, y);

      if (current && !inside) {
        start = x;
        inside = true;
      }

      if ((!current || x === W) && inside) {

        const end = x;
        const width = end - start;

        if (width > 12) {

          let fontSize = 12;

          if (width < 65) fontSize = 8;
          else if (width < 100) fontSize = 10;
          else if (width > 350) fontSize = 14;

          ctx.font = `bold ${fontSize}px Arial`;

          const gap = 3;
          const selected = [];

          let total = 0;
          let index = (row * 7) % words.length;

          while (index < words.length * 3) {

            const word = words[index % words.length];
            const wordWidth = ctx.measureText(word).width;

            if (total + wordWidth > width) break;

            selected.push({
              word: word,
              width: wordWidth
            });

            total += wordWidth + gap;
            index++;
          }

          if (selected.length) {

            total -= gap;

            // Satırı tam ortala
            let pos = start + (width - total) / 2;

            selected.forEach((item, i) => {

              ctx.fillStyle =
                i % 3 === 0 ? "#ff4eae" :
                i % 3 === 1 ? "#ff91d0" :
                "#ffd0ec";

              ctx.shadowColor = "#ff1493";
              ctx.shadowBlur = 12;

              ctx.fillText(item.word, pos, y);

              pos += item.width + gap;
            });
          }
        }

        inside = false;
      }
    }

    row++;
  }

  ctx.shadowBlur = 0;
}

draw();
</script>

</body>
</html>
